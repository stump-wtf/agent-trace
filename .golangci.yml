version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
  settings:
    errcheck:
      # Defer of Close is a common Go pattern; the error from Close on a
      # read-only SQLite handle, rows cursor, or file is not actionable.
      # errcheck matches on the receiver's concrete type, so an
      # `(io.Closer).Close` entry would never fire for these call sites.
      exclude-functions:
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
