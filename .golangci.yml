version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

linters-settings:
  errcheck:
    # Defer of Close is a common Go pattern; the error from Close on a
    # read-only SQLite handle or file is not actionable.
    exclude-functions:
      - (io.Closer).Close
